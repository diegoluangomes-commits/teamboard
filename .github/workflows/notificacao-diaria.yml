name: Notificação diária de agendas

on:
  schedule:
    # Todo dia às 10:00 UTC = 07:00 Brasília (UTC-3) — segunda a sexta
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # permite disparar manualmente para teste

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enviar notificações do dia
        run: |
          HTTP_CODE=$(curl -s -o /tmp/resposta.json -w "%{http_code}" -X POST \
            "https://solidezteam.solidez.net/api/notify/agendas-do-dia" \
            -H "x-api-key: ${{ secrets.TEAMSOLIDEZ_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "HTTP: $HTTP_CODE"
          echo "Resposta:"
          cat /tmp/resposta.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRO: resposta $HTTP_CODE"
            exit 1
          fi
          echo "OK"
